# Local synthetic credentials only. Override in .env; never reuse real secrets.
# Use a separate -p project and distinct DB_PORT/TEST_DB_PORT per verifier.
services:
  db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cinema_dev}
      MYSQL_USER: ${DB_USER:-cinema_dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fictional_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fictional_dev_root_password}
      TZ: Europe/Rome
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - dev_data:/var/lib/mysql
    networks: [dev]
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  test-db:
    profiles: [test]
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${TEST_DB_NAME:-cinema_test}
      MYSQL_USER: ${TEST_DB_USER:-cinema_test}
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:-fictional_test_password}
      MYSQL_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD:-fictional_test_root_password}
      TZ: Europe/Rome
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-3307}:3306"
    volumes:
      - test_data:/var/lib/mysql
    networks: [test]
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

# `docker compose --profile test down` preserves both volumes.
# Do not use `down -v`: it would remove development storage too.
volumes:
  dev_data:
  test_data:

networks:
  dev:
  test:
