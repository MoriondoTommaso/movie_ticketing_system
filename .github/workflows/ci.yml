name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.13 / MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: cinema-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Build package
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Configure synthetic databases
        run: cp .env.example .env

      - name: Start MySQL and wait for readiness
        run: docker compose --profile test up -d --wait --wait-timeout 180

      - name: Run full regression suite
        run: python -m pytest -ra --junitxml=test-results/pytest.xml

      - name: Collect database diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose --profile test ps -a > test-results/compose-status.txt
          docker compose --profile test logs --no-color > test-results/mysql.log 2>&1

      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Stop CI databases
        if: always()
        run: docker compose --profile test down
